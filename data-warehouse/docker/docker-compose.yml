name: taller4-dw

services:
  # PostgreSQL guarda la metadata interna de Airflow (DAGs, runs, usuarios).
  # No tiene nada que ver con las fuentes de datos del taller.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD en .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migración inicial y creación del usuario admin, antes de levantar Airflow.
  airflow-init:
    image: local/ecommerce-airflow:2.11.2
    build:
      context: .
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY en .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY en .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/src
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # Fuente relacional (RDS MySQL)
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST en .env}
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-etl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD en .env}
      # Fuente documental (DocumentDB, requiere TLS)
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI en .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-ecommerce}
      # Destino raw (S3) — las credenciales las da el rol IAM de la EC2, no hace falta access key
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET en .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Warehouse (Redshift Serverless), usado por dbt y por el COPY S3->raw
      REDSHIFT_HOST: ${REDSHIFT_HOST:?Set REDSHIFT_HOST en .env}
      REDSHIFT_PORT: "5439"
      REDSHIFT_DATABASE: ${REDSHIFT_DATABASE:-ecommerce_dw}
      REDSHIFT_USER: ${REDSHIFT_USER:-etl}
      REDSHIFT_PASSWORD: ${REDSHIFT_PASSWORD:?Set REDSHIFT_PASSWORD en .env}
      # Rol IAM que Redshift asume para leer de S3 en el COPY (terraform output redshift_s3_role_arn)
      REDSHIFT_S3_ROLE_ARN: ${REDSHIFT_S3_ROLE_ARN:?Set REDSHIFT_S3_ROLE_ARN en .env}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD en .env}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: &airflow-volumes
      - ../src/airflow/dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
      - ../global-bundle.pem:/opt/airflow/global-bundle.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: version

  airflow-webserver:
    image: local/ecommerce-airflow:2.11.2
    build:
      context: .
    command: webserver
    environment: *airflow-environment
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: *airflow-volumes
    ports:
      - "${AIRFLOW_UI_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: local/ecommerce-airflow:2.11.2
    build:
      context: .
    command: scheduler
    environment: *airflow-environment
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_logs:
  postgres_data:
